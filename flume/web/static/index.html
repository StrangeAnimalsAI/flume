<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flume</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #262b36; --text: #d7dce3;
    --dim: #8b93a1; --accent: #6aa7ff; --warn: #ff7a6a; --think: #c7a6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { display: flex; gap: 18px; align-items: baseline; padding: 14px 20px;
           border-bottom: 1px solid var(--border); position: sticky; top: 0;
           background: var(--bg); z-index: 2; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; color: var(--accent); }
  nav a { color: var(--dim); text-decoration: none; margin-right: 12px; }
  nav a.active, nav a:hover { color: var(--text); }
  main { padding: 18px 20px 60px; max-width: 1400px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: 8px; padding: 12px 16px; min-width: 130px; }
  .card .n { font-size: 20px; color: var(--accent); }
  .card .l { color: var(--dim); font-size: 12px; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0 24px; }
  th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--border);
           vertical-align: top; }
  th { color: var(--dim); font-weight: normal; position: sticky; top: 52px;
       background: var(--bg); }
  tr:hover td { background: var(--panel); }
  a { color: var(--accent); }
  h2 { font-size: 14px; color: var(--dim); margin: 22px 0 4px;
       text-transform: uppercase; letter-spacing: .06em; }
  .filters { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  input, select, button { background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
      font: inherit; }
  button { cursor: pointer; }
  .err { color: var(--warn); }
  .dim { color: var(--dim); }
  .block { background: var(--panel); border: 1px solid var(--border);
           border-radius: 8px; padding: 10px 14px; margin: 8px 0;
           white-space: pre-wrap; word-break: break-word; }
  .block.thinking { border-left: 3px solid var(--think); }
  .block.tool_arguments, .block.tool_result { border-left: 3px solid var(--accent); }
  .block .meta { color: var(--dim); font-size: 12px; margin-bottom: 6px; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px;
           font-size: 11px; border: 1px solid var(--border); color: var(--dim); }
  .badge.thinking { color: var(--think); border-color: var(--think); }
  .clip { max-width: 420px; overflow: hidden; text-overflow: ellipsis;
          white-space: nowrap; display: inline-block; vertical-align: bottom; }
  details summary { cursor: pointer; color: var(--dim); }
  /* uPlot ships a light theme; these are the only bits that need reclaiming. */
  .uplot, .u-title, .u-legend { color: var(--text); font-family: inherit !important; }
  .u-legend .u-marker { border-color: currentColor !important; }
  .u-select { background: rgba(106,167,255,.15); }
  .u-over, .u-under { border-color: var(--border) !important; }
  /* Stacked proportional bar: one <i> per segment, width set inline. */
  .split { display: flex; height: 22px; border-radius: 6px; overflow: hidden;
           border: 1px solid var(--border); margin: 6px 0 4px; }
  .split i { display: block; height: 100%; }
  .split-key { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim);
               font-size: 12px; margin-bottom: 18px; }
  .split-key b { font-weight: normal; color: var(--text); }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px;
            margin-right: 5px; vertical-align: baseline; }
  .chart { margin: 4px 0 22px; }
</style>
<link rel="stylesheet" href="/assets/uplot.min.css">
<script src="/assets/uplot.min.js"></script>
</head>
<body>
<header>
  <h1>flume</h1>
  <nav id="nav"></nav>
</header>
<main id="main">loading…</main>
<script>
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (path) => {
  const res = await fetch(path);
  if (!res.ok) {
    // FastAPI reports handled errors as {detail}; an unhandled 500 is plain
    // text, so parsing unconditionally hid the real error behind a JSON
    // syntax error.
    const body = await res.text();
    let message = body;
    try { message = JSON.parse(body).detail ?? body; } catch { /* not JSON */ }
    throw new Error(`${res.status}: ${message}`.slice(0, 300));
  }
  return res.json();
};
const fmtTs = (ns) => ns ? new Date(ns / 1e6).toISOString()
  .replace("T", " ").slice(0, 19) : "-";
const fmtDur = (ms) => ms == null ? "-" : ms < 1000 ? ms + "ms"
  : ms < 90_000 ? (ms / 1000).toFixed(1) + "s"
  : ms < 5_400_000 ? (ms / 60000).toFixed(1) + "m"
  : (ms / 3_600_000).toFixed(1) + "h";
const fmtNum = (n) => (n ?? 0).toLocaleString("en-US");
const fmtTok = (n) => n == null ? "-"
  : n >= 1e9 ? (n / 1e9).toFixed(1) + "B"
  : n >= 1e6 ? (n / 1e6).toFixed(1) + "M"
  : n >= 1e3 ? (n / 1e3).toFixed(0) + "k" : String(n);

// Views render to an HTML string, so anything needing a live DOM node (a
// chart) registers here and runs once the markup is in the document.
let pendingMounts = [];
let liveCharts = [];   // uPlot instances + their resize observers, per view
const onMount = (fn) => pendingMounts.push(fn);

function runMounts() {
  const queued = pendingMounts;
  pendingMounts = [];
  for (const fn of queued) {
    try { fn(); } catch (err) { console.error("mount failed", err); }
  }
}

// Navigating away replaces #main wholesale, orphaning any observer still
// pointed at the old nodes. Tear them down before the next view mounts.
function disposeCharts() {
  for (const { chart, observer } of liveCharts) {
    observer?.disconnect();
    chart?.destroy?.();
  }
  liveCharts = [];
}

/** Mount a uPlot that tracks its container's width. */
function mountChart(el, opts, data) {
  const chart = new uPlot({ ...opts, width: el.clientWidth || 900 }, data, el);
  const observer = new ResizeObserver(() => {
    const width = el.clientWidth;
    if (width > 0) chart.setSize({ width, height: opts.height });
  });
  observer.observe(el);
  liveCharts.push({ chart, observer });
}

const TABS = [
  ["overview", "Overview"], ["insights", "Insights"], ["sessions", "Sessions"],
  ["tools", "Tools"], ["tokens", "Tokens"], ["audit", "Audit"],
  ["search", "Search"],
];

function nav() {
  const route = location.hash.replace(/^#\/?/, "") || "overview";
  const current = route.split("/")[0];
  $("#nav").innerHTML = TABS.map(([id, label]) =>
    `<a href="#/${id}" class="${current === id ? "active" : ""}">${label}</a>`
  ).join("");
  return route;
}

function table(rows, cols) {
  if (!rows || !rows.length) return `<p class="dim">(none)</p>`;
  const head = cols.map(([, label]) => `<th>${esc(label)}</th>`).join("");
  const body = rows.map((r) =>
    `<tr>${cols.map(([render]) => `<td>${render(r)}</td>`).join("")}</tr>`
  ).join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

const sessionLink = (id) =>
  `<a href="#/sessions/${encodeURIComponent(id)}">${esc(id.slice(0, 8))}…</a>`;

const SPLIT_COLORS = { tool: "#6aa7ff", model: "#c7a6ff", idle: "#3a4150",
                       unaccounted: "#262b36" };

function healthPanel(h) {
  // Work done leads, not context occupancy: across sessions, redundant work
  // tracks how much has been done, while context depth stops predicting it
  // once ordinal position is held constant.
  // tool calls and wall are already in the card row directly above; the point
  // of this row is the four numbers that row cannot show.
  const cards = [
    ["model requests", fmtNum(h.headline.model_requests)],
    ["peak context", fmtTok(h.headline.peak_context_tokens)],
    ["re-send factor", h.headline.resend_factor + "×"],
    ["cache coverage", h.headline.cache_coverage_pct + "%"],
    ["redundancy", h.headline.redundancy_pct + "%"],
    ["errors", h.headline.error_pct + "%"],
  ].map(([l, n]) => `<div class="card"><div class="n">${n}</div>
      <div class="l">${l}</div></div>`).join("");

  const t = h.time;
  const segs = [["tool", t.tool_ms], ["model", t.model_ms],
                ["idle", t.idle_ms], ["unaccounted", t.unaccounted_ms]];
  const total = t.wall_ms || 1;
  const bar = segs.map(([k, ms]) =>
    `<i style="width:${(100 * ms / total).toFixed(2)}%;background:${SPLIT_COLORS[k]}"
        title="${k}: ${fmtDur(ms)}"></i>`).join("");
  const key = segs.map(([k, ms]) =>
    `<span><span class="swatch" style="background:${SPLIT_COLORS[k]}"></span>${k}
      <b>${fmtDur(ms)}</b> ${(100 * ms / total).toFixed(0)}%</span>`).join("");

  const curve = h.context_curve;
  if (curve.length > 1) {
    onMount(() => {
      const el = document.getElementById("ctx-chart");
      if (!el || typeof uPlot === "undefined") return;
      const data = [
        curve.map((p) => p.elapsed_ms / 60000),
        curve.map((p) => p.context_tokens),
      ];
      mountChart(el, {
        height: 220,
        cursor: { y: false },
        scales: { x: { time: false } },
        axes: [
          { stroke: "#8b93a1", grid: { stroke: "#262b36" },
            ticks: { stroke: "#262b36" },
            values: (u, vs) => vs.map((v) => v.toFixed(0) + "m") },
          { stroke: "#8b93a1", grid: { stroke: "#262b36" },
            ticks: { stroke: "#262b36" },
            values: (u, vs) => vs.map((v) => (v / 1000).toFixed(0) + "k") },
        ],
        series: [
          { label: "elapsed", value: (u, v) => v == null ? "-" : v.toFixed(1) + "m" },
          { label: "context", stroke: "#6aa7ff", width: 2,
            fill: "rgba(106,167,255,.12)",
            value: (u, v) => v == null ? "-" : fmtNum(v) + " tok" },
        ],
      }, data);
    });
  }

  const toolRows = h.tools.length ? table(h.tools.slice(0, 8), [
    [(r) => esc(r.name), "tool"],
    [(r) => fmtDur(r.total_ms), "time held"],
    [(r) => fmtNum(r.calls), "calls"],
    [(r) => fmtDur(r.mean_ms), "mean"],
    [(r) => r.errors ? `<span class="err">${r.errors}</span>` : "0", "errors"],
    [(r) => fmtTok(r.result_tokens), "result tok"],
  ]) : "";

  // Detected by share of prefix re-written, not elapsed quiet: the cache TTL
  // is in no transcript, so a duration threshold misfires in both directions.
  const exp = h.cache.expiries;
  const expiryHtml = exp.length ? `
    <h2>cache expiries (${exp.length}) — ${fmtTok(h.cache.expiry_tokens)} re-established</h2>`
    + table(exp, [
      [(r) => fmtDur(r.quiet_ms), "quiet before"],
      [(r) => fmtNum(r.rewrote_tokens), "prefix re-written"],
    ]) : `<h2>cache</h2><p class="dim">no expiries —
      ${fmtTok(h.cache.read_tokens)} read vs ${fmtTok(h.cache.written_tokens)} written</p>`;

  const red = h.redundancy;
  const redHtml = red.repeats ? `
    <h2>redundancy — ${red.repeats} repeated calls
      (${red.stutters} stutters, ${red.long_range} long-range,
       median ${red.median_gap} calls apart)</h2>`
    + table(red.worst, [
      [(r) => esc(r.name), "tool"],
      [(r) => r.gap, "calls since original"],
      [(r) => `<span class="clip" title="${esc(r.args_preview)}">${esc(r.args_preview)}</span>`, "args"],
    ]) : "";

  return `<h2>health</h2><div class="cards">${cards}</div>
    <h2>where the time went</h2>
    <div class="split">${bar}</div><div class="split-key">${key}</div>
    <h2>context occupancy</h2>
    <div class="chart" id="ctx-chart"></div>
    ${toolRows ? "<h2>tools by time held</h2>" + toolRows : ""}
    ${expiryHtml}
    ${redHtml}`;
}

const fmtAgo = (ns) => {
  if (!ns) return "unknown";
  const ms = Date.now() - ns / 1e6;
  return ms < 0 ? "just now" : fmtDur(ms) + " ago";
};

async function viewInsights() {
  const since = state.insightSince || "7d";
  // Read the daemon's precomputed findings by default. Recomputing on request
  // costs a fifth of a second warm but several seconds cold, and only the
  // stored rows carry occurrence history — how long a problem has persisted
  // is the thing a snapshot cannot tell you.
  const live = state.insightsLive === true;
  const payload = await api(
    `/api/insights?since=${since}` + (live ? "" : "&stored=1")
  );
  const findings = payload.findings ?? [];

  // Precomputed but empty means the daemon has not covered this window yet;
  // say so rather than implying a clean bill of health.
  const uncovered = !live && !findings.length;
  const freshness = live
    ? `<span class="dim">computed just now</span>`
    : uncovered
      ? `<span class="err">no stored run for ${esc(since)}</span>`
      : `<span class="dim">stored, computed ${fmtAgo(payload.computed_at_ns)}</span>`;

  const picker = `
    <div class="filters">
      ${["24h", "7d", "30d"].map((w) =>
        `<button onclick="state.insightSince='${w}';state.insightsLive=false;render()"
           style="${w === since ? "border-color: var(--accent)" : ""}">${w}</button>`
      ).join("")}
      ${freshness}
      <button onclick="state.insightsLive=true;render()"
        ${live ? "disabled" : ""}>recompute now</button>
      ${live ? `<button onclick="state.insightsLive=false;render()">back to stored</button>` : ""}
    </div>
    <div class="filters"><span class="dim">detectors: toolgaps · repeat waste ·
      error hotspots · context floods · idle-gap churn · marathons ·
      premium grind · docnav adoption</span></div>`;
  const sevName = {1: "act now", 2: "worth fixing", 3: "watch"};
  const sevColor = {1: "var(--warn)", 2: "var(--accent)", 3: "var(--dim)"};
  const blocks = findings.map((f) => [
    `<div class="block" style="white-space:normal;border-left:3px solid ${sevColor[f.severity]}">`,
    `<div class="meta"><span class="badge" style="color:${sevColor[f.severity]};border-color:${sevColor[f.severity]}">${sevName[f.severity]}</span> `,
    `<span class="badge">${esc(f.kind)}</span>`,
    // Occurrences only exist on stored rows — it is the count of scheduled
    // runs that still saw this, i.e. how long it has been true.
    f.occurrences > 1
      ? ` <span class="dim">seen in ${f.occurrences} runs since
          ${fmtTs(f.first_seen_ns).slice(0, 10)}</span>`
      : f.first_seen_ns ? ` <span class="dim">new</span>` : "",
    `</div><strong>${esc(f.title)}</strong>`,
    `<div class="dim" style="margin:6px 0">${esc(f.detail ?? "")}</div>`,
    `<div>&rarr; ${esc(f.action ?? "")}</div></div>`,
  ].join("")).join("");
  const empty = uncovered
    ? `<p class="dim">Nothing stored for this window yet. The daemon fills it
       when run with <code>--refresh-insights</code>; until then use
       <em>recompute now</em>.</p>`
    : `<p class="dim">(no findings in window)</p>`;
  return picker + (blocks || empty);
}

async function viewAudit() {
  const since = state.auditSince || "30d";
  const params = since ? `?since=${since}` : "";
  const [repeats, bigReads, gaps] = await Promise.all([
    api("/api/audit/repeats" + params),
    api("/api/audit/whole_file_reads" + params),
    api("/api/audit/toolgaps" + params),
  ]);
  const picker = `
    <div class="filters">
      ${["7d", "30d", "12w", ""].map((w) =>
        `<button onclick="state.auditSince='${w}';render()"
           style="${w === since ? "border-color: var(--accent)" : ""}">
           ${w || "all time"}</button>`).join("")}
    </div>`;
  return picker + `
    <h2>repeated identical calls — byte-identical = provably zero new information</h2>` +
    table(repeats, [
      [(r) => sessionLink(r.session_id), "session"],
      [(r) => esc(r.name), "tool"],
      [(r) => r.calls, "times"],
      [(r) => r.byte_identical
          ? `<span class="err">yes</span>`
          : r.distinct_results > 1 ? "no (results differed)" : `<span class="dim">unknown</span>`,
       "byte-identical"],
      [(r) => fmtDur(r.total_ms), "total time"],
      [(r) => `<span class="clip" title="${esc(r.args_preview)}">
          ${esc(r.args_preview)}</span>`, "arguments"],
    ]) + `
    <h2>whole-file reads ≥ 50k chars (no offset/limit)</h2>` +
    table(bigReads, [
      [(r) => sessionLink(r.session_id), "session"],
      [(r) => fmtNum(r.result_chars), "chars"],
      [(r) => fmtDur(r.duration_ms), "dur"],
      [(r) => `<span class="clip" title="${esc(r.args_preview)}">
          ${esc(r.args_preview)}</span>`, "arguments"],
    ]) + `
    <h2>throwaway-script clusters — durable-tool candidates (same shape, many sessions)</h2>` +
    gaps.map((g) => `
      <div class="block tool_arguments">
        <div class="meta"><span class="badge">${g.sessions} sessions</span>
          imports: ${esc(g.imports)} ${g.operations ? "· ops: " + esc(g.operations) : ""}</div>
        <details><summary>example script</summary>${esc(g.example)}</details>
      </div>`).join("") +
    (gaps.length ? "" : `<p class="dim">(no recurring script shapes in window)</p>`);
}

async function viewOverview() {
  const data = await api("/api/overview");
  let arch = null;
  try { arch = await api("/api/archive"); } catch (e) { /* archive optional */ }
  const t = data.totals || {};
  const cards = [
    ["sessions", t.sessions], ["turns", t.turns], ["tool calls", t.tool_calls],
    ["thinking blocks", t.thinking_blocks],
    ["output tokens", fmtNum(t.output_tokens)],
    ["cache read", fmtNum(t.cache_read_tokens)],
    ["active time", fmtDur(t.active_ms)],
  ].map(([l, n]) => `<div class="card"><div class="n">${n ?? 0}</div>
      <div class="l">${l}</div></div>`).join("");
  const bySource = table(data.by_source, [
    [(r) => esc(r.source), "source"],
    [(r) => fmtNum(r.sessions), "sessions"],
    [(r) => fmtNum(r.turns), "turns"],
    [(r) => fmtNum(r.tool_calls), "tool calls"],
    [(r) => fmtNum(r.thinking_blocks), "thinking blocks"],
    [(r) => fmtNum(r.output_tokens), "output tokens"],
  ]);
  let archiveHtml = "";
  if (arch) {
    const gb = (n) => (n / 1e9).toFixed(2) + " GB";
    archiveHtml = `<h2>raw archive & retention</h2>` + table(arch.stats, [
      [(r) => esc(r.source), "source"],
      [(r) => fmtNum(r.sessions), "sessions"],
      [(r) => fmtNum(r.blobs), "blob versions"],
      [(r) => gb(r.raw_bytes), "raw size"],
      [(r) => fmtTs(r.oldest_ns), "oldest"],
      [(r) => fmtTs(r.newest_ns), "newest"],
      [(r) => esc(arch.retention.raw_overrides[r.source] ?? arch.retention.raw),
       "raw ttl"],
      [(r) => esc(arch.retention.analyzed_overrides[r.source] ?? arch.retention.analyzed),
       "analyzed ttl"],
    ]);
  }
  return `<div class="cards">${cards}</div><h2>by source</h2>${bySource}${archiveHtml}`;
}

async function viewSessions() {
  if (state.filters.top_level === undefined) state.filters.top_level = "1";
  const params = new URLSearchParams(
    Object.entries(state.filters).filter(([, v]) => v));
  const rows = await api("/api/sessions?" + params);
  const filters = `
    <div class="filters">
      <label><input type="checkbox" ${state.filters.top_level === "1" ? "checked" : ""}
        onchange="setFilter('top_level', this.checked ? '1' : '')">
        top-level only</label>
      <select onchange="setFilter('source', this.value)">
        <option value="">all sources</option>
        <option ${sel("source","claude-code")} value="claude-code">claude-code</option>
        <option ${sel("source","codex")} value="codex">codex</option>
      </select>
      <input placeholder="project contains…" value="${esc(state.filters.cwd || "")}"
             onchange="setFilter('cwd', this.value)">
      <select onchange="setFilter('since', this.value)">
        <option value="">all time</option>
        <option ${sel("since","24h")} value="24h">24h</option>
        <option ${sel("since","7d")} value="7d">7d</option>
        <option ${sel("since","30d")} value="30d">30d</option>
      </select>
    </div>`;
  return filters + table(rows, [
    [(r) => fmtTs(r.started_at_ns), "started (utc)"],
    [(r) => esc(r.project ?? "-"), "project"],
    [(r) => esc(r.source) + (r.is_subagent ? ` <span class="badge">child</span>` : ""),
     "source"],
    [(r) => sessionLink(r.session_id), "session"],
    [(r) => r.children
        ? `<span class="badge thinking">${r.children}</span>` : "-",
     "children"],
    [(r) => r.turn_count, "turns"],
    [(r) => r.tool_call_count, "tools"],
    [(r) => fmtNum(r.output_tokens), "out tok"],
    [(r) => fmtDur(r.wall_ms), "wall"],
    [(r) => `<span class="clip" title="${esc(r.first_user_message)}">
        ${esc(r.first_user_message ?? "")}</span>`, "first message"],
  ]);
}

async function viewSession(id) {
  const [s, contents, commands, health] = await Promise.all([
    api(`/api/sessions/${encodeURIComponent(id)}`),
    api(`/api/sessions/${encodeURIComponent(id)}/contents`),
    api(`/api/sessions/${encodeURIComponent(id)}/commands`),
    // Health is additive: a failure here must not blank the transcript view.
    api(`/api/sessions/${encodeURIComponent(id)}/health`).catch(() => null),
  ]);
  if (!s) return `<p class="err">session not found</p>`;
  const family = s.family || {};
  const hasKids = (s.children || []).length > 0;
  const roll = (key, fmt) => hasKids && family[key] !== (s[key] || 0)
      ? `${fmt(family[key])} <span class="dim">(${fmt(s[key] || 0)} own)</span>`
      : fmt(s[key] || 0);
  const cards = [
    ["sessions in family", hasKids ? family.sessions : 1],
    ["turns", roll("turn_count", (n) => n)],
    ["tool calls", roll("tool_call_count", (n) => n)],
    ["thinking blocks", roll("thinking_blocks", (n) => n)],
    ["output tokens", roll("output_tokens", fmtNum)],
    ["cache hit", cacheRatio(s)],
    ["wall", fmtDur(s.wall_ms)],
  ].map(([l, n]) => `<div class="card"><div class="n">${n ?? 0}</div>
      <div class="l">${l}</div></div>`).join("");
  const parentLine = s.parent_session_id
      ? `<p class="dim">child of ${sessionLink(s.parent_session_id)}</p>` : "";
  const meta = `<p class="dim">${esc(s.project ?? "?")} · ${esc(s.source)} ·
      ${esc(s.surface ?? "?")} · ${esc(s.model ?? "?")} · ${esc(s.cwd ?? "?")} ·
      ${esc(s.git_branch ?? "")} · ${fmtTs(s.started_at_ns)}</p>` + parentLine;
  const commandsHtml = commands.length ? `
    <h2>commands (${commands.length})</h2>` + table(commands, [
      [(r) => fmtTs(r.started_at_ns), "asked (utc)"],
      [(r) => `<span class="clip" style="max-width:520px"
          title="${esc(r.prompt)}">${esc(r.prompt)}</span>`, "prompt"],
      [(r) => fmtDur(r.duration_ms), "took"],
      [(r) => r.turns, "turns"],
      [(r) => r.tool_calls, "tools"],
      [(r) => fmtNum(r.output_tokens), "out tok"],
      [(r) => fmtNum(r.cache_read_tokens), "cache read"],
    ]) : "";
  const childrenHtml = hasKids ? `
    <h2>child sessions (${s.children.length})</h2>` + table(s.children, [
      [(r) => fmtTs(r.started_at_ns), "started"],
      [(r) => sessionLink(r.session_id), "session"],
      [(r) => `<span class="clip" title="${esc(r.first_user_message)}">
          ${esc(r.first_user_message ?? "")}</span>`, "task"],
      [(r) => r.turn_count, "turns"],
      [(r) => r.tool_call_count, "tools"],
      [(r) => fmtNum(r.output_tokens), "out tok"],
      [(r) => fmtDur(r.wall_ms), "wall"],
    ]) : "";
  const turns = table(s.turns, [
    [(r) => r.turn_index, "#"],
    [(r) => fmtTs(r.started_at_ns), "start"],
    [(r) => fmtDur(r.duration_ms), "dur"],
    [(r) => fmtNum(r.input_tokens), "in"],
    [(r) => fmtNum(r.output_tokens), "out"],
    [(r) => fmtNum(r.cache_read_tokens), "cache read"],
    [(r) => fmtNum(r.cache_creation_tokens), "cache new"],
    [(r) => fmtNum(r.thinking_chars), "think chars"],
  ]);
  const tools = table(s.tool_calls, [
    [(r) => fmtTs(r.started_at_ns), "start"],
    [(r) => esc(r.name), "tool"],
    [(r) => fmtDur(r.duration_ms), "dur"],
    [(r) => r.is_error ? `<span class="err">error</span>` : "", ""],
    [(r) => fmtNum(r.result_chars), "result chars"],
    [(r) => `<span class="clip" title="${esc(r.args_preview)}">
        ${esc(r.args_preview)}</span>`, "arguments"],
  ]);
  const byKind = (kind) => contents.filter((c) => c.kind === kind);
  const blocks = contents.map((c) => `
    <div class="block ${esc(c.kind)}">
      <div class="meta"><span class="badge ${esc(c.kind)}">${esc(c.kind)}</span>
        ${fmtTs(c.ts_ns)} ${c.span_id ? "· span " + esc(c.span_id) : ""}</div>
      ${c.text.length > 2000
        ? `<details><summary>${esc(c.text.slice(0, 400))}…
             (${fmtNum(c.text.length)} chars)</summary>${esc(c.text)}</details>`
        : esc(c.text)}
    </div>`).join("");
  const thinkingOnly = byKind("thinking").map((c) => `
    <div class="block thinking">
      <div class="meta">${fmtTs(c.ts_ns)}</div>${esc(c.text)}
    </div>`).join("");
  return `
    <p><a href="#/sessions">← sessions</a></p>
    <h2>session ${esc(id)}</h2>${meta}
    <div class="cards">${cards}</div>
    ${health ? healthPanel(health) : ""}
    ${commandsHtml}
    ${childrenHtml}
    <h2>thinking (${byKind("thinking").length})</h2>
    ${thinkingOnly || `<p class="dim">(no thinking blocks captured
        ${s.source === "codex" ? "— Codex reasoning is encrypted at the source" : ""})</p>`}
    <h2>turns</h2>${turns}
    <h2>tool calls</h2>${tools}
    <h2>full transcript (${contents.length} items)</h2>${blocks}`;
}

const cacheRatio = (s) => {
  const denominator = (s.input_tokens || 0) + (s.cache_read_tokens || 0);
  return denominator ? Math.round(100 * s.cache_read_tokens / denominator) + "%" : "-";
};

async function viewTools() {
  const data = await api("/api/tools?top=15");
  return `
    <h2>per tool</h2>` + table(data.per_tool, [
      [(r) => esc(r.name), "tool"],
      [(r) => fmtNum(r.calls), "calls"],
      [(r) => r.errors ? `<span class="err">${r.errors}</span>` : "0", "errors"],
      [(r) => fmtDur(Math.round(r.avg_ms)), "avg"],
      [(r) => fmtDur(r.max_ms), "max"],
      [(r) => fmtDur(r.total_ms), "total"],
      [(r) => fmtNum(r.total_result_chars), "result chars"],
    ]) + `
    <h2>repeated calls (same tool + args in one session)</h2>` +
    table(data.repeated_calls, [
      [(r) => sessionLink(r.session_id), "session"],
      [(r) => esc(r.name), "tool"],
      [(r) => r.calls, "times"],
      [(r) => `<span class="clip" title="${esc(r.args_preview)}">
          ${esc(r.args_preview)}</span>`, "arguments"],
    ]) + `
    <h2>slowest calls</h2>` + table(data.slowest, [
      [(r) => sessionLink(r.session_id), "session"],
      [(r) => esc(r.name), "tool"],
      [(r) => fmtDur(r.duration_ms), "dur"],
      [(r) => r.is_error ? `<span class="err">error</span>` : "", ""],
      [(r) => `<span class="clip" title="${esc(r.args_preview)}">
          ${esc(r.args_preview)}</span>`, "arguments"],
    ]) + `
    <h2>largest results</h2>` + table(data.largest_results, [
      [(r) => sessionLink(r.session_id), "session"],
      [(r) => esc(r.name), "tool"],
      [(r) => fmtNum(r.result_chars), "chars"],
      [(r) => `<span class="clip" title="${esc(r.args_preview)}">
          ${esc(r.args_preview)}</span>`, "arguments"],
    ]);
}

async function viewTokens() {
  const group = state.tokenGroup || "source";
  const rows = await api("/api/tokens?group_by=" + group);
  const picker = `
    <div class="filters">
      ${["source", "surface", "model", "session"].map((g) =>
        `<button onclick="state.tokenGroup='${g}';render()"
          style="${g === group ? "border-color: var(--accent)" : ""}">${g}</button>`
      ).join("")}
    </div>`;
  return picker + table(rows, [
    [(r) => group === "session" ? sessionLink(r.grp) : esc(r.grp ?? "-"), group],
    [(r) => fmtNum(r.sessions), "sessions"],
    [(r) => fmtNum(r.input_tokens), "input"],
    [(r) => fmtNum(r.output_tokens), "output"],
    [(r) => fmtNum(r.cache_read_tokens), "cache read"],
    [(r) => fmtNum(r.cache_creation_tokens), "cache new"],
    [(r) => fmtNum(r.reasoning_tokens), "reasoning"],
    [(r) => Math.round(100 * r.cache_hit_ratio) + "%", "cache hit"],
  ]);
}

async function viewSearch() {
  const q = state.searchQ || "";
  const kind = state.searchKind || "";
  let results = "";
  if (q) {
    const params = new URLSearchParams({ q });
    if (kind) params.append("kind", kind);
    const rows = await api("/api/search?" + params);
    results = rows.length ? rows.map((r) => `
      <div class="block ${esc(r.kind)}">
        <div class="meta">
          <span class="badge ${esc(r.kind)}">${esc(r.kind)}</span>
          ${sessionLink(r.session_id)} · ${esc(r.source)} · ${esc(r.cwd ?? "?")}
        </div>${esc(r.snippet)}
      </div>`).join("") : `<p class="dim">(no matches)</p>`;
  }
  return `
    <div class="filters">
      <input id="q" size="50" placeholder='search — e.g. "missing tool" or navigat*'
             value="${esc(q)}"
             onkeydown="if(event.key==='Enter'){state.searchQ=this.value;render()}">
      <select onchange="state.searchKind=this.value;render()">
        <option value="">all kinds</option>
        ${["thinking","user_message","assistant_message","tool_arguments","tool_result"]
          .map((k) => `<option ${k === kind ? "selected" : ""} value="${k}">${k}</option>`)
          .join("")}
      </select>
      <button onclick="state.searchQ=$('#q').value;render()">search</button>
    </div>${results}`;
}

const state = { filters: {} };
const sel = (key, value) => state.filters[key] === value ? "selected" : "";
function setFilter(key, value) { state.filters[key] = value; render(); }

// Views are async and some take tens of seconds. Without a guard, a slow
// response lands after you have navigated away and overwrites the view you
// are actually looking at — leaving the URL and the content disagreeing.
let renderSeq = 0;

async function render() {
  const seq = ++renderSeq;
  const stale = () => seq !== renderSeq;
  const route = nav();
  const [view, arg] = route.split(/\/(.+)/);
  const main = $("#main");
  disposeCharts();

  // Don't flash a spinner on views that return instantly; only say something
  // once the wait is long enough to look broken.
  const spinner = setTimeout(() => {
    if (!stale()) main.innerHTML = `<p class="dim">loading ${esc(view)}…</p>`;
  }, 150);

  try {
    let html;
    if (view === "overview") html = await viewOverview();
    else if (view === "sessions" && arg) html = await viewSession(arg);
    else if (view === "sessions") html = await viewSessions();
    else if (view === "tools") html = await viewTools();
    else if (view === "tokens") html = await viewTokens();
    else if (view === "insights") html = await viewInsights();
    else if (view === "audit") html = await viewAudit();
    else if (view === "search") html = await viewSearch();
    else html = `<p class="err">unknown view</p>`;

    clearTimeout(spinner);
    // A newer render started while this one was awaiting; its result is what
    // the URL now describes, so drop ours rather than overwrite the screen.
    if (stale()) { pendingMounts = []; return; }
    main.innerHTML = html;
    runMounts();  // charts need their container in the document first
  } catch (err) {
    clearTimeout(spinner);
    pendingMounts = [];
    if (stale()) return;
    main.innerHTML = `<p class="err">${esc(err.message)}</p>`;
  }
}
window.addEventListener("hashchange", render);
render();
</script>
</body>
