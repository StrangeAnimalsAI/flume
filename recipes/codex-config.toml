# Codex live OpenTelemetry trace recipe for ~/.codex/config.toml.
#
# Copy this [otel] block into the user's global Codex config after manager
# review. Do not symlink or include this file directly unless Codex grows a
# supported include mechanism.
#
# Why trace_exporter, not exporter?
# - otel.exporter configures Codex's OTEL log exporter.
# - otel.trace_exporter configures Codex's OTEL trace exporter.
# The local collector currently has only a traces pipeline, so live Codex
# sessions need trace_exporter to appear in Langfuse.

[otel]
environment = "local"
log_user_prompt = false
trace_exporter = { otlp-http = { endpoint = "http://localhost:4318/v1/traces", protocol = "binary" } }
