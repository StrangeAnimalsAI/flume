[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flume"
version = "0.1.0"
description = "Local-first telemetry and analysis for Claude Code and Codex sessions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "langfuse==4.5.1",
    "httpx>=0.28.1,<0.29",
    "anthropic>=0.92",
    "claude-agent-sdk>=0.2",
]

[project.scripts]
flume = "flume.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["flume"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.12",
]
