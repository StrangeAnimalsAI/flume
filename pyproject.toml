[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-telemetry"
version = "0.1.0"
description = "Unified OTel telemetry for coding agents (Claude Code, Codex, future harness) into Langfuse."
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
]

[tool.hatch.build.targets.wheel]
packages = ["agent_telemetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.0",
]
