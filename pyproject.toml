[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-telemetry"
version = "0.1.0"
description = "Unified OTel telemetry for coding agents (Claude Code, Codex, future harness) into Langfuse."
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "langfuse==4.5.1",
    "httpx>=0.28.1,<0.29",
]

[project.scripts]
agent-telemetry-auto-ingest = "agent_telemetry.ingest.cli:main"
agent-telemetry-analyze = "agent_telemetry.store.cli:main"
agent-telemetry-serve = "agent_telemetry.store.server:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_telemetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.0",
]
