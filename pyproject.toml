[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flume"
version = "0.1.0"
description = "Local-first telemetry and analysis for Claude Code and Codex sessions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Core install has NO model-vendor dependencies: ingesting and analyzing
# transcripts never calls a model. The harness backends that do are extras.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.92"]
claude-sdk = ["claude-agent-sdk>=0.2"]
# The openai backend speaks /v1/chat/completions over stdlib urllib — no
# extra needed; it is listed for discoverability only.
openai = []
harness = ["anthropic>=0.92", "claude-agent-sdk>=0.2"]
# `flume serve` only. Ingest, analyze, and the hooks that run in cron stay
# dependency-free; the dashboard is the one surface that earns a framework.
web = ["fastapi>=0.118", "uvicorn>=0.38"]

[project.scripts]
flume = "flume.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["flume"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# ARG (unused arguments) is separate from F's unused *locals* and *imports*,
# which is why a dead `parser` parameter sat unnoticed. Where a signature is
# fixed by an interface — the `_cmd_*(store, args)` dispatch, a classifier
# swapped in for another — prefix the unused half with `_` to say "required,
# not used"; ruff's dummy-variable convention then passes it.
select = ["E4", "E7", "E9", "F", "B", "ARG"]

[tool.ruff.lint.per-file-ignores]
# Test doubles exist to match a signature, not to use every argument.
"tests/*" = ["ARG"]

[dependency-groups]
# Dev installs every harness extra so CI exercises all backends; the
# published package still carries no model-vendor dependency.
dev = [
    "pytest>=9.0",
    "ruff>=0.12",
    "anthropic>=0.92",
    "claude-agent-sdk>=0.2",
    "anyio>=4",
    "fastapi>=0.118",
    "uvicorn>=0.38",
    "httpx2>=0.29",  # starlette.testclient (httpx v1 is deprecated there)
]
